# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.small-crm-eb
  name: "Small CRM (Electrobun)"
  version: 0.1.4
  category: business
  description: "The Small CRM Blend in its smallest build: Electrobun with the system webview and the app host on Bun, no Chromium and no Node. Deals pipeline, contacts, companies, follow-ups and a pipeline report inside the full ACRYL frame with chat and agents."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The CRM's domain: companies, contacts, deals, activities and follow-ups, saved as JSON in the app's data home. Every page below injects it.
    - id: crm
      name: crm
    # The page shell every page shares: the sidebar (pages register their entry) and the cool white look.
    - id: crm-shell
      name: crm-shell
    # The deals board with its inspector, the default work surface (also answers /).
    - id: pipeline
      name: pipeline
    # One deal in full: details, next action, activity log, won / lost confirmation.
    - id: deals
      name: deals
    # The contacts directory, with orphans, a form and a CSV import.
    - id: contacts
      name: contacts
    # Company list and profiles with linked contacts and deals.
    - id: companies
      name: companies
    # The follow-up queue and the activity timeline.
    - id: activities
      name: activities
    # The lightweight pipeline report.
    - id: reports
      name: reports
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    # Sharing: `npm run acryl -- plugin pull github:<owner>/<repo>@<version>` installs a plugin someone released (development only).
    - id: plugin-share
      name: plugin-share
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
