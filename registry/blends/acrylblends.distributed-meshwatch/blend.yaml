# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.distributed-meshwatch
  name: "Meshwatch"
  version: 0.1.0
  category: distributed-systems
  description: "A distributed-systems console: a Raft cluster's topology map, node health, quorum, the append-only commit log, replica lag and failover drills that move the leader."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The mesh's domain: nodes, leader and term, quorum arithmetic, the commit log, events and drills, saved as JSON in the app's data home. Every plugin below injects it.
    - id: meshwatch
      name: meshwatch
    # The cluster shell every page shares: the top bar, the cluster heading, the statistics and the tabs.
    - id: mesh-shell
      name: mesh-shell
    # The node inspector (right column): the selected node, a health control and recent events.
    - id: inspector
      name: inspector
    # Topology map, the first page (/): the nodes and their links.
    - id: topology
      name: topology
    # Consensus log (/consensus): the append-only commit log.
    - id: consensus
      name: consensus
    # Replica health (/replicas): role, status, lag and heartbeat per node.
    - id: replicas
      name: replicas
    # Failover drills (/drills): run a failover or a quorum test, and reset the fixture.
    - id: drills
      name: drills
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
