# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.snippets
  name: "Snippet Manager"
  version: 0.1.0
  category: developer
  description: "A developer's snippet vault: 128 reusable code snippets with tags, variables, syntax-coloured previews, search and collections."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The library itself: snippets, tags, variables and collections, saved as JSON in the app's data home. Every page injects it.
    - id: snippets
      name: snippets
    # The page shell: the dark top bar, the sidebar with its language and collection lists, and the look every page shares.
    - id: snips-shell
      name: snips-shell
    # The two-pane library: the snippet list, search and filters, and the code editor with the snippet's actions (also answers /).
    - id: library
      name: library
    # The editor: one form that creates a snippet or changes one, and the New snippet button in the top bar.
    - id: editor
      name: editor
    # Collections: named lists of snippets, with their pages and the collection list in the sidebar.
    - id: collections
      name: collections
    # The languages settings page: the five languages the library knows and how much of it each holds.
    - id: language-settings
      name: language-settings
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one, which Settings > Plugins switches with `disabled: true`.
    # This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with a row is never started twice.
    # Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only.
    - id: acryl-door
      name: acryl-door
