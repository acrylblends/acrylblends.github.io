# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.lab-notebook
  name: "Lab Notebook"
  version: 0.1.0
  category: scientific-engineering
  description: "A research notebook: three notebooks and 23 experiments, an append-only record with measurements, a chart, observations, attachments, audit history, an exact unit converter and a CSV data table."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: notebooks, experiments, append-only measurements and observations, attachments, the audit trail and unit conversion, saved as JSON.
    - id: lab
      name: lab
    # The page shell: the FIELD / LAB sidebar with the notebooks, the new-notebook action, the experiment list and the project footer.
    - id: lab-shell
      name: lab-shell
    # Experiments: create at /experiments/new, the audit history and the JSON record export. It mounts before the record so /experiments/new wins.
    - id: experiments
      name: experiments
    # The experiment record at / and /experiments/:id: the paper, measurement cards, chart, observations, audit trail, converter and metadata.
    - id: record
      name: record
    # Notebooks: the list at /notebooks and the create form at /notebooks/new.
    - id: notebooks
      name: notebooks
    # The data table at /data: sample-level measurements, a formulation filter, the append form and the CSV export.
    - id: data-table
      name: data-table
    # Attachments: the files kept with an experiment, with type and size validation.
    - id: attachments
      name: attachments
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one, which Settings > Plugins switches with `disabled: true`.
    # This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with a row is never started twice.
    # Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only.
    - id: acryl-door
      name: acryl-door
