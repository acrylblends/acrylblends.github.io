# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.system-monitor
  name: "System Monitor"
  version: 0.1.0
  category: system
  description: "This machine's memory, disks and heaviest processes on one live page, with a kill-list that asks before it ends a program."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The monitor: this machine's memory, disks and heaviest processes on one live page, with a kill-list that asks before it ends a program.
    - id: monitor
      name: monitor
      config:
        # How many processes the kill-list shows.
        listSize: 10
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
