apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.robot-missions
  name: "Robot Missions"
  version: 0.1.0
  category: robotics
  description: "A map-first robot mission planner: five robots, five missions with ordered waypoints, run/pause/reset simulation, telemetry history and an event log. Simulation only."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    - id: home
      name: home
    # The domain: robots, missions, waypoints, the facility map and simulation events, saved as JSON in the app's data home.
    - id: fleet
      name: fleet
    # The MOTION/OPS top bar.
    - id: fleet-shell
      name: fleet-shell
    # The mission history at /missions: every mission with its status and the simulation event log.
    - id: history
      name: history
    # The planner: fleet rail, facility map, waypoint editor and simulation controls.
    - id: missions
      name: missions
    # Robot detail at /robots/:id: battery, pose, mode, telemetry history and assigned missions.
    - id: robots
      name: robots
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    - id: acryl-door
      name: acryl-door
