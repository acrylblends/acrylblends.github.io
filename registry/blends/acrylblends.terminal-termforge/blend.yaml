# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.terminal-termforge
  name: "Termforge"
  version: 0.1.0
  category: terminal
  description: "A terminal workspace simulator: workspaces with tabs, a strict command allowlist answered from fixtures, a command deck and task launcher, saved snippets, command history and recall, and a session status panel. It never runs a host process."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: workspaces, tabs, the command allowlist and its fixtures, snippets and tasks, saved as JSON in the app's data home. Every plugin below injects it.
    - id: termforge
      name: termforge
    # The shell every region shares: the rail, the top bar, the console area and the status column.
    - id: term-shell
      name: term-shell
    # Workspaces (rail).
    - id: workspaces
      name: workspaces
    # Command deck (rail): shortcuts that fill the prompt.
    - id: deck
      name: deck
    # Task launcher (rail): build, test and deploy routines.
    - id: tasks
      name: tasks
    # The console, the first page (/): tabs, the terminal and the prompt.
    - id: console
      name: console
    # Command snippets (right column).
    - id: snippets
      name: snippets
    # Session overview, recent commands and keyboard notes (right column).
    - id: session
      name: session
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
