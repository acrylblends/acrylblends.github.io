# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.p2p-swarmdrop
  name: "Swarmdrop"
  version: 0.1.0
  category: p2p
  description: "A peer-to-peer transfer room: a chunk availability map with rarest-first requests, synthetic peers with rate and latency, a pausable simulation with a corrupt-copy retry, integrity verification and a completion receipt, and rooms you can create or join by code. Nothing is transferred."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: rooms, chunk ranges, peers, events and integrity checks, saved as JSON in the app's data home. Every plugin below injects it.
    - id: swarmdrop
      name: swarmdrop
    # The console shell every region shares: the header, the transfer hero and the two columns.
    - id: swarm-shell
      name: swarm-shell
    # The transfer room, the first page (/), and the file hero.
    - id: room
      name: room
    # Chunk map, range inspector and the pause, advance and verify routes.
    - id: chunks
      name: chunks
    # Transfer events.
    - id: events
      name: events
    # Swarm peers and Add demo peer.
    - id: peers
      name: peers
    # Integrity check and receipt.
    - id: receipt
      name: receipt
    # Transfer rooms, create, join and Copy room code.
    - id: rooms
      name: rooms
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
