# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.remote-relay
  name: "Remote Relay"
  version: 0.1.0
  category: remote-computing
  description: "A remote-computing workspace: saved SSH-style connections, simulated terminal sessions with allowlisted demo commands, a transfer queue with file metadata and a session audit log."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The relay's domain: connection profiles, simulated sessions, the allowlisted demo commands, transfer jobs and the audit log, saved as JSON in the app's data home. Every plugin below injects it.
    - id: relay
      name: relay
    # The workspace shell every page shares: the top bar with New session, the three columns, the tabs and the session bar.
    - id: relay-shell
      name: relay-shell
    # Saved connections (left column): the workspace's profiles, the workspaces, and Add connection.
    - id: connections
      name: connections
    # Session details (right column): the selected session, recent sessions and the security note.
    - id: session-rail
      name: session-rail
    # The Terminal tab (/): the simulated session, allowlisted demo commands, opening and closing sessions.
    - id: terminal
      name: terminal
    # The File transfer tab (/transfer): the simulated queue, its states and the transfer policy.
    - id: transfers
      name: transfers
    # The Session audit tab (/audit): the session's event log and the connection's detail.
    - id: audit
      name: audit
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
