# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.web-pagefoundry
  name: "Pagefoundry"
  version: 0.1.0
  category: web
  description: "A website builder: a site of pages built from blocks, a live browser-framed preview with selectable sections, an inspector for headline, background, width and visibility with a contrast check, preview mode for desktop and mobile, and simulated publishes with warnings."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The site's domain: pages and sections, the block library, contrast checks, theme, preview mode and simulated builds, saved as JSON in the app's data home. Every plugin below injects it.
    - id: pagefoundry
      name: pagefoundry
    # The builder shell every region shares: the top bar and the three regions.
    - id: builder-shell
      name: builder-shell
    # Pages (left): the site map and New page.
    - id: pages
      name: pages
    # Add block (left): the block library.
    - id: blocks
      name: blocks
    # The canvas, the first page (/): the live preview.
    - id: canvas
      name: canvas
    # Design inspector (right): the selected section.
    - id: design
      name: design
    # Theme and publish (right) and the Preview and Publish buttons.
    - id: publish
      name: publish
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
