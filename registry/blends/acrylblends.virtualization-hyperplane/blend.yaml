# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.virtualization-hyperplane
  name: "Hyperplane"
  version: 0.1.0
  category: virtualization
  description: "A virtualization console: pick a host, search and filter the machine inventory, start, pause, stop and snapshot machines under a lifecycle state machine with capacity guards, and provision new ones."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The fleet's domain: hosts, machines, the lifecycle state machine, capacity checks, snapshots and the activity log, saved as JSON in the app's data home. Every page below injects it.
    - id: hyperplane
      name: hyperplane
    # The console shell every page shares: the top bar with Provision VM, the sidebar with the pages, hosts and recent activity, and the machine table.
    - id: fleet-shell
      name: fleet-shell
    # Cluster overview, the first page (/): KPIs, the machine inventory with the host rail's filter and search, resource allocation and recent snapshots.
    - id: overview
      name: overview
    # Virtual machines: the filtered inventory (/machines), a machine's detail and lifecycle actions, provisioning, snapshots and removal.
    - id: machines
      name: machines
    # Snapshots (/snapshots): every restore point, and delete.
    - id: snapshots
      name: snapshots
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
