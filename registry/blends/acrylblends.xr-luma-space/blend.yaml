# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.xr-luma-space
  name: "Luma Space"
  version: 0.1.0
  category: xr
  description: "An XR scene composer: a stylised 3D viewport with AR, VR and MR preview modes, an object hierarchy with parent-child transforms in metres, a transform inspector, spatial anchors, a simulated interaction preview and scene validation. Nothing is an XR session."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: scene objects, transforms, modes, interactions and validation, saved as JSON in the app's data home. Every plugin below injects it.
    - id: luma
      name: luma
    # The editor shell every region shares: the rail, the viewport area and the inspector column.
    - id: luma-shell
      name: luma-shell
    # Scene objects (rail): hierarchy, Add spatial anchor, health.
    - id: objects
      name: objects
    # The viewport, the first page (/): the scene, modes and world scale.
    - id: viewport
      name: viewport
    # Object inspector (right): transform, parent, visibility and interaction.
    - id: inspector
      name: inspector
    # Scene validation (right).
    - id: validation
      name: validation
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
