# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.accessibility-clearpath-audit
  name: "Clearpath Audit"
  version: 0.1.0
  category: accessibility
  description: "An accessibility audit and assistive-preview console: sample findings filtered by priority, a live sample page with the affected component outlined, high-contrast, larger-text and focus-outline previews, remediation that is applied to the preview, and a re-run score. A triage concept, not a conformance check."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: findings, view settings and runs, saved as JSON in the app's data home. Every plugin below injects it.
    - id: clearpath
      name: clearpath
    # The console shell every region shares: the top bar, the rail, the preview and the detail column.
    - id: audit-shell
      name: audit-shell
    # Audit summary (rail).
    - id: summary
      name: summary
    # Issues by priority (rail).
    - id: issues
      name: issues
    # The live preview, the first page (/), and its view settings.
    - id: preview
      name: preview
    # Issue details and the remediation checklist (right column).
    - id: detail
      name: detail
    # Re-run sample audit (top bar) and the re-run summary (rail).
    - id: rerun
      name: rerun
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
