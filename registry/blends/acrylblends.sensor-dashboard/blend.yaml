apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.sensor-dashboard
  name: "Sensor Dashboard"
  version: 0.1.0
  category: embedded-iot
  description: "An IoT operations dashboard: 12 devices with 11 online, 4,320 readings an hour, one critical and one warning alert, live sensor cards, a 24h/7d history, device details, threshold editing, an alert log and a validated HTTP ingest contract."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    - id: home
      name: home
    # The domain: devices, readings, thresholds and alerts, saved as JSON in the app's data home.
    - id: sensors
      name: sensors
    # The SENSEGRID top bar with the tenant and the simulate action.
    - id: sensors-shell
      name: sensors-shell
    # The dashboard at /: the summary, live sensor cards, device status and the 24h/7d history.
    - id: dashboard
      name: dashboard
    # Devices at /devices and /devices/:id: the inventory with an offline filter, readings, thresholds and device alerts.
    - id: devices
      name: devices
    # The alert log at /alerts: threshold crossings, their state and the acknowledge action.
    - id: alerts
      name: alerts
    # The HTTP ingest contract at /ingest: device, unit and timestamp validation, with an alert when a threshold is crossed.
    - id: ingest
      name: ingest
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    - id: acryl-door
      name: acryl-door
