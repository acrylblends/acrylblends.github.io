# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.libraries-foundry
  name: "The Foundry"
  version: 0.1.0
  category: libraries-frameworks
  description: "A curated package atlas: search and filter libraries and frameworks, read their metadata and version history, copy an install command, and assemble a local stack with warnings and a manifest preview."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The atlas's domain: the catalogue, filters and search, and the stack with its manifest and checks, saved as JSON in the app's data home. Every plugin below injects it.
    - id: foundry
      name: foundry
    # The atlas shell every page shares: the header, the search box and the three columns.
    - id: foundry-shell
      name: foundry-shell
    # Explore catalogue (left column): Type, Framework and Language filters.
    - id: filters
      name: filters
    # Featured building blocks, the first page (/): the package cards.
    - id: catalogue
      name: catalogue
    # Package detail (right column): metadata, install command, versions, Add to stack.
    - id: detail
      name: detail
    # Stack comparison (/stack): pinned versions, warnings, manifest preview.
    - id: stack
      name: stack
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
