# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.cloud-costs
  name: "Cloud Costs"
  version: 0.1.0
  category: cloud
  description: "A FinOps cost explorer: monthly spend per provider and service from CSV exports, with forecasts, budgets and alerts."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The FinOps workspace: providers, imports, cost lines, budgets, alerts and allocation rules, saved as JSON in the app's data home.
    - id: finops
      name: finops
    # The workspace shell: the dark top bar with the billing period and the white sidebar with the providers.
    - id: finops-shell
      name: finops-shell
    # The cost overview: month-to-date, the budget gauge, the forecast, the daily stack and the spend by service (also answers /).
    - id: overview
      name: overview
    # The cost explorer and the billing import, with the import history and the duplicate state.
    - id: explorer
      name: explorer
    # Budgets, alerts and the allocation rules that attribute services to teams.
    - id: budgets
      name: budgets
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one, which Settings > Plugins switches with `disabled: true`.
    # This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with a row is never started twice.
    # Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only.
    - id: acryl-door
      name: acryl-door
