# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.compliance-northstar-grc
  name: "Northstar GRC"
  version: 0.1.0
  category: compliance
  description: "A governance workbench: a control register over three frameworks with evidence freshness, an evidence review (accept, request a refresh, mark an exception), a risk watchlist with treatments and a recalculating posture strip, audit actions and an exportable review. Illustrative data; no certification claimed."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: controls, evidence, risks, actions and the audit trail, saved as JSON in the app's data home. Every plugin below injects it.
    - id: grc
      name: grc
    # The cockpit shell every region shares: the masthead, the posture strip, the register and the side column.
    - id: grc-shell
      name: grc-shell
    # Posture strip: coverage, evidence, risks and actions.
    - id: posture
      name: posture
    # The control register, the first page (/).
    - id: register
      name: register
    # Evidence review, exception and review history (side column).
    - id: evidence
      name: evidence
    # Risk watchlist, treatment and the New risk form.
    - id: risks
      name: risks
    # Audit actions (side column).
    - id: actions
      name: actions
    # Export review (masthead).
    - id: review-export
      name: review-export
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
