# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.hci-sensepath-lab
  name: "Sensepath Lab"
  version: 0.1.0
  category: hci
  description: "An interaction research workbench: six simulated input modalities (speech, gesture, eye tracking, alternative input, haptics, a BCI concept), a scenario with a calibration, a deterministic task simulation with synthetic timing events, and saved observations to compare. No sensor is accessed."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: modalities, calibrations, runs and observations, saved as JSON in the app's data home. Every plugin below injects it.
    - id: sensepath
      name: sensepath
    # The workbench shell every region shares: the rail, the header and the two columns.
    - id: sense-shell
      name: sense-shell
    # Input modalities (rail).
    - id: modalities
      name: modalities
    # The workbench, the first page (/): variants, scenario, calibration and the run routes.
    - id: workbench
      name: workbench
    # Session snapshot (right column).
    - id: snapshot
      name: snapshot
    # Save observation (header) and the observations list and comparison (right column).
    - id: observations
      name: observations
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
