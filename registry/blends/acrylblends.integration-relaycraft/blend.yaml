# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.integration-relaycraft
  name: "Relaycraft"
  version: 0.1.0
  category: integration
  description: "An integration studio: connectors and connections, a pipeline canvas of source, transform and destination, field mappings with sample-record preview, and a deterministic sync simulation with run history."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The studio's domain: connectors, pipelines and mappings, sample records and the sync simulation, saved as JSON in the app's data home. Every plugin below injects it.
    - id: relaycraft
      name: relaycraft
    # The studio shell every page shares: the rail, the title, the actions and the right column.
    - id: craft-shell
      name: craft-shell
    # Pipelines, the first page (/): the canvas, mappings, preview and Save draft.
    - id: pipelines
      name: pipelines
    # Connections (/connections) and the Connected systems card.
    - id: connections
      name: connections
    # Run history (/runs), the Latest run card and Run pipeline.
    - id: runs
      name: runs
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
