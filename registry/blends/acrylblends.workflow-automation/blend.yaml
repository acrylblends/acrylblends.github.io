# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.workflow-automation
  name: "Workflow Automation"
  version: 0.1.0
  category: automation
  description: "n8n-class workflow automation as an ACRYL Blend: a visual workflow editor (React Flow), triggers (manual, schedule, webhook), HTTP, JSON, data mapping, routers and loops, durable runs you can inspect, and the ACRYL agent building, testing and fixing workflows for you. Built on Qadam Flow (MIT)."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # Workflow automation's domain: workflows (Qadam Flow's flow format and operations), connections, runs and the schedules of active workflows,
    # saved in the app's data home. Every row below injects it, so switching it off takes them all.
    - id: automation
      name: automation
    # The JSON API the screen and other callers use, the live event stream, and the webhook entry of active workflows.
    - id: automation-api
      name: automation-api
    # The screen: workflows, the editor with its canvas, runs, connections and integrations. Answers the app's root.
    - id: automation-studio
      name: automation-studio
    # The ACRYL agent as the app's operator: typed tools (find actions, build and change steps, validate, test, read runs) in the app's tools registry;
    # publishing, activating and tests that reach outside the app wait for the person's Approve in the app.
    - id: automation-tools
      name: automation-tools
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    # Sharing: `npm run acryl -- plugin pull github:<owner>/<repo>@<version>` installs a plugin someone released (development only).
    - id: plugin-share
      name: plugin-share
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
