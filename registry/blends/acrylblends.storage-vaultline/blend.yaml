# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.storage-vaultline
  name: "Vaultline"
  version: 0.1.0
  category: storage
  description: "A storage console: pool capacity and health, volumes created against free capacity, object buckets with browsable metadata, and a snapshot ledger with retention."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The vault's domain: pools, volumes, buckets and objects, snapshots with retention and the capacity arithmetic, saved as JSON in the app's data home. Every plugin below injects it.
    - id: vaultline
      name: vaultline
    # The console shell every page shares: the top bar, the capacity statistics and the tabs.
    - id: vault-shell
      name: vault-shell
    # Fabric overview, the first page (/): pool capacity and fabric health.
    - id: fabric
      name: fabric
    # Volume explorer (/volumes): create, activate, scrub and delete volumes.
    - id: volumes
      name: volumes
    # Object browser (/objects): buckets, folders, objects and their metadata.
    - id: objects
      name: objects
    # Snapshot ledger (/snapshots): record, verify and purge snapshots.
    - id: snapshots
      name: snapshots
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
