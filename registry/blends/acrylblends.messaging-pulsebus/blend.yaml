# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.messaging-pulsebus
  name: "Pulsebus"
  version: 0.1.0
  category: messaging-infrastructure
  description: "An event-bus explorer: browse topics and consumer groups, read a message stream with delivery and retry state, inspect JSON payloads, publish schema-validated synthetic events, replay and manage the dead-letter queue."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The bus's domain: topics and schemas, consumer groups, messages and their delivery state machine, saved as JSON in the app's data home. Every plugin below injects it.
    - id: pulsebus
      name: pulsebus
    # The explorer shell every page shares: the header, the title and the three columns.
    - id: bus-shell
      name: bus-shell
    # Topics and consumer groups (left column).
    - id: topics
      name: topics
    # The message stream, the first page (/): metrics, messages, replay.
    - id: stream
      name: stream
    # The event inspector (right column): payload, headers and publishing.
    - id: inspector
      name: inspector
    # The dead-letter queue (/dead-letters): redrive or discard.
    - id: dead-letters
      name: dead-letters
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
