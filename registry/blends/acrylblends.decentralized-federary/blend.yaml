# The app as data, in ACRYL's Blend format (blends.acryl.dev/v1alpha1): which plugins it mounts, in what order, with what config.
# Edit this, not app.ts, to switch a plugin off (disabled: true) or change its config. `npm run lock` records what the app is built from.
apiVersion: blends.acryl.dev/v1alpha1
kind: Blueprint
metadata:
  id: acrylblends.decentralized-federary
  name: "Federary Network"
  version: 0.1.0
  category: decentralized
  description: "A federation administration console: a topology map of fictional instances with trust edges and health, an instance profile with policy, identity assertion and handshake, inbound and outbound federation requests, a moderation queue, trust rules that can stop an approval, and reversible recorded decisions."
  license: MIT
  visibility: public
spec:
  runtime: cordis
  parameters:
    # The address the server listens on.
    hostname: { type: string, default: 127.0.0.1 }
  rows:
    - id: router
      name: acryl-router
    # The home page's widgets: a feature plugin puts its UI on the home page with ctx.home.widget, and it leaves with the plugin.
    - id: home
      name: home
    # The domain: instances, links, reports, trust rules, decisions and events, saved as JSON in the app's data home. Every plugin below injects it.
    - id: federary
      name: federary
    # The console shell every region shares: the masthead, the stats strip, the topology and the side column.
    - id: fed-shell
      name: fed-shell
    # Network stats.
    - id: stats
      name: stats
    # The federation map, the first page (/).
    - id: topology
      name: topology
    # Instance profile, peering actions and handshake.
    - id: profile
      name: profile
    # Federation requests and Review peer request.
    - id: queue
      name: queue
    # Moderation queue.
    - id: moderation
      name: moderation
    # Trust rules.
    - id: trust
      name: trust
    # Peering history and Undo.
    - id: history
      name: history
    # Export topology (masthead).
    - id: topology-export
      name: topology-export
    # A feature is a plugin: its folder plugins/<name>/ plus a row of its own above this one (`- id: notes` / `name: notes`), which Settings > Plugins
    # switches with `disabled: true`. This row starts the folders that have no row yet (a live install with `.acryl/bin/acryl plugin add`); a folder with
    # a row is never started twice. Read-only when NODE_ENV=production.
    - id: extensions
      name: extensions
    - id: server
      name: acryl-node-server
      config:
        hostname: "{{parameters.hostname}}"
    # The door: an agent working in this folder looks at the page and acts on it through .acryl/bin/acryl. Development only: src/app.ts leaves it out when NODE_ENV=production.
    - id: acryl-door
      name: acryl-door
