name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # Never deploy a registry that does not validate (same check as registry.yml).
      - uses: actions/checkout@v4
        with:
          repository: acryldev/acryl
          ref: f5e3b76409b06bc43f2ae5a8f462e6ed78711c10
          path: .acryl
          sparse-checkout: runtime/blends-core
      - run: bun install --production
        working-directory: .acryl/runtime/blends-core
      - run: bun scripts/registry-index.ts registry --check
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Each entry as its own archive, named with its integrity in the deployed index, so create-acrylblends downloads one starter and not this repository. Only on the copy
      # being deployed: the repository stays source only. Node, always, so a redeploy of the same files publishes the same bytes.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/registry-archives.mjs dist/registry
      - name: SPA fallback for client-side routes (GitHub Pages has no server-side rewrite)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
